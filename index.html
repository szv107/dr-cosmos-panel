<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr.Cosmos WebApp Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Базовые настройки темы в стиле iOS/Dark Premium */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0b0713; /* Глубокий ночной фон с фиолетовым отливом */
            background-image: 
                radial-gradient(circle at top left, rgba(136, 51, 255, 0.15), transparent 40%),
                radial-gradient(circle at bottom right, rgba(161, 75, 255, 0.1), transparent 50%);
            background-attachment: fixed;
            color: #ffffff;
            margin: 0;
            padding: 20px 15px 100px 15px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Ключевые анимации появления */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 8px rgba(136, 51, 255, 0.4); }
            50% { box-shadow: 0 0 20px rgba(136, 51, 255, 0.7); }
            100% { box-shadow: 0 0 8px rgba(136, 51, 255, 0.4); }
        }

        /* Анимированный заголовок */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeInUp 0.5s ease forwards;
        }
        .app-header-title {
            margin: 0;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        /* Стеклянные карточки (Glassmorphism) */
        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            opacity: 0;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .card:nth-child(2) { animation-delay: 0.15s; }
        .card:nth-child(3) { animation-delay: 0.3s; }

        h2 {
            margin-top: 0;
            color: #b380ff; /* Мягкий неоновый фиолетовый */
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.2px;
        }

        /* Поля ввода и выпадающие списки */
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 6px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.2px;
        }
        select, input, textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: #ffffff;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        select:focus, input:focus, textarea:focus {
            border-color: #a14bff;
            background: rgba(136, 51, 255, 0.05);
            outline: none;
            box-shadow: 0 0 12px rgba(161, 75, 255, 0.2);
        }

        /* Блюрные футуристичные кнопки */
        button {
            width: 100%;
            background: rgba(136, 51, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            border: 1px solid rgba(161, 75, 255, 0.4);
            padding: 14px;
            border-radius: 14px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            animation: pulseGlow 3s infinite;
        }
        button:active {
            transform: scale(0.97);
            background: rgba(136, 51, 255, 0.4);
            box-shadow: 0 0 15px rgba(136, 51, 255, 0.6);
        }

        /* Блюрная кнопка опасного действия (рассылка) */
        .broadcast-btn {
            background: rgba(229, 57, 53, 0.15);
            border: 1px solid rgba(244, 67, 54, 0.4);
            animation: none;
            box-shadow: 0 4px 15px rgba(229, 57, 53, 0.1);
        }
        .broadcast-btn:active {
            background: rgba(229, 57, 53, 0.35);
            box-shadow: 0 0 15px rgba(229, 57, 53, 0.5);
        }

        /* Контейнер для фиксации кнопки рассылки внизу экрана */
        .bottom-action-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 15px;
            background: linear-gradient(to top, #0b0713 80%, transparent);
            z-index: 10;
        }
        
        .btn-icon {
            display: inline-block;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#b380ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 17L12 22L22 17" stroke="#b380ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="#b380ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="app-header-title">Управление Студией Dr.Cosmos</p>
    </div>

    <div class="card">
        <h2>
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2Z" stroke="#b380ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 6V18" stroke="#b380ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9.83 8C8.83 8.32 8.12 9.04 8 10C7.88 10.96 8.35 11.66 9.35 12.01L12.01 12.98C13.01 13.33 13.48 14.03 13.36 14.99C13.24 15.95 12.53 16.67 11.53 16.99" stroke="#b380ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Управление ценами
        </h2>
        <div class="form-group">
            <label for="service-select">Выберите услугу:</label>
            <select id="service-select">
                <option value="Infinity">🍹 Коктейль Инфинити</option>
                <option value="Renaissance">🍹 Коктейль Ренессанс</option>
                <option value="RenaissancePlus">🍹 Коктейль Ренессанс Плюс</option>
                <option value="InfHair">🍹 Коктейль Инфинити Hair</option>
                <option value="InfHairPlus">🍹 Коктейль Инфинити Hair Плюс</option>
                <option value="RFLifting">✨ РФ Лифтинг</option>
                <option value="Chistka">✨ Чистка лица</option>
                <option value="Botulo">✨ Ботулинотерапия</option>
                <option value="Lips">✨ Губы (контур)</option>
                <option value="LaserRemove">✨ Удаление лазером</option>
            </select>
        </div>
        <div class="form-group">
            <label for="new-price">Новая цена:</label>
            <input type="text" id="new-price" placeholder="Например: 130$ или 700.000 сум">
        </div>
        <button onclick="savePrice()">
            <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M13 3L3 13L13 23V3Z" fill="#ffffff"/>
                <path d="M11 1L21 11L11 21V1Z" fill="#ffffff"/>
            </svg>
            Применить новую цену
        </button>
    </div>

    <div class="card">
        <h2>
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2Z" stroke="#b380ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M7 11.5L10 14.5L17 7.5" stroke="#b380ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Массовая рассылка
        </h2>
        <div class="form-group">
            <label for="broadcast-text">Текст уведомления (HTML поддерживается):</label>
            <textarea id="broadcast-text" rows="4" placeholder="Введите текст акции или новости для клиентов..."></textarea>
        </div>
    </div>

    <div class="bottom-action-container">
        <button class="broadcast-btn" onclick="startBroadcast()">
            <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 21L21 12L1 3V10L11 12L1 14V21Z" fill="#ffffff"/>
            </svg>
            Запустить рассылку по базе
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function savePrice() {
            const service = document.getElementById('service-select').value;
            const price = document.getElementById('new-price').value;

            if (!price) {
                alert('Пожалуйста, введите цену!');
                return;
            }

            const data = {
                action: "web_edit_price",
                service: service,
                price: price
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        }

        function startBroadcast() {
            const text = document.getElementById('broadcast-text').value;

            if (!text) {
                alert('Введите текст для рассылки!');
                return;
            }

            const data = {
                action: "web_broadcast",
                text: text
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
