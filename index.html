<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr.Cosmos WebApp Admin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0b0713; color: #ffffff; font-family: sans-serif; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 20px; margin-bottom: 20px; position: relative; }
        
        /* Список услуг - делаем его «липким» и самым верхним */
        .custom-select-wrapper { position: relative; z-index: 9999; }
        .custom-select-trigger { background: #1a1429; padding: 15px; border-radius: 12px; cursor: pointer; border: 1px solid #444; }
        
        .custom-options { 
            position: absolute; top: 100%; left: 0; right: 0; 
            background: #251d38; border-radius: 12px; margin-top: 5px;
            display: none; /* Скрыт по умолчанию */
            border: 1px solid #777;
            max-height: 300px; overflow-y: auto;
        }
        .custom-options.show { display: block; }
        .custom-option { padding: 15px; border-bottom: 1px solid #333; cursor: pointer; }
        
        /* Рассылка - убираем любые настройки наложения */
        .broadcast-card { position: relative; z-index: 1; }
        button { width: 100%; padding: 15px; background: #8833ff; color: #fff; border: none; border-radius: 12px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <label>Выберите услугу:</label>
        <div class="custom-select-wrapper">
            <div class="custom-select-trigger" onclick="document.getElementById('opts').classList.toggle('show')">
                <span id="selectedLabel">Коктейль Инфинити</span>
            </div>
            <div class="custom-options" id="opts">
                <div class="custom-option" onclick="select('Infinity', 'Коктейль Инфинити')">Коктейль Инфинити</div>
                <div class="custom-option" onclick="select('Renaissance', 'Коктейль Ренессанс')">Коктейль Ренессанс</div>
                <div class="custom-option" onclick="select('Mono', 'Моно нити')">Моно нити</div>
                <div class="custom-option" onclick="select('Screw', 'Скрю нити')">Скрю нити</div>
            </div>
        </div>
        <input type="hidden" id="service-value" value="Infinity">
    </div>

    <div class="card broadcast-card">
        <h2>Массовая рассылка</h2>
        <textarea id="broadcast-text" style="width:100%; background:black; color:white;"></textarea>
        <button onclick="startBroadcast()">Запустить</button>
    </div>

    <script>
        function select(val, text) {
            document.getElementById('selectedLabel').innerText = text;
            document.getElementById('service-value').value = val;
            document.getElementById('opts').classList.remove('show');
        }
        function startBroadcast() {
            const text = document.getElementById('broadcast-text').value;
            window.Telegram.WebApp.sendData(JSON.stringify({action: "web_broadcast", text: text}));
        }
    </script>
</body>
</html>
