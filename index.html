<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr.Cosmos WebApp Admin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Общие стили для темной темы */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212); /* Глубокий темный фон */
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
            padding-bottom: 80px; /* Отступ для нижней кнопки */
        }

        /* Заголовок с логотипом */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px;
            background: linear-gradient(135deg, rgba(82, 0, 150, 0.2) 0%, rgba(121, 0, 191, 0.1) 100%);
            border-radius: 12px;
            border: 1px solid rgba(82, 0, 150, 0.3);
        }
        .app-header-title {
            margin: 0;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
        }

        /* Карточка с закругленными углами */
        .card {
            background: rgba(255, 255, 255, 0.05); /* Полупрозрачный темный фон */
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
            color: var(--tg-theme-button-color, #8833ff); /* Насыщенный фиолетовый */
            font-size: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Группа формы */
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            color: rgba(255,255,255,0.7);
        }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255, 255, 255, 0.03); /* Очень темный фон ввода */
            color: var(--tg-theme-text-color, #ffffff);
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        select:focus, input:focus, textarea:focus {
            border-color: #8833ff;
            outline: none;
        }

        /* Кнопки */
        button {
            width: 100%;
            background: var(--tg-theme-button-color, linear-gradient(135deg, #7e1fff 0%, #a14bff 100%)); /* Фиолетовый градиент */
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            box-shadow: 0 2px 4px rgba(126, 31, 255, 0.3);
        }
        button:hover {
            opacity: 0.9;
        }

        /* Кнопка рассылки: красный фон */
        .broadcast-btn {
            background: linear-gradient(135deg, #e53935 0%, #f44336 100%);
            box-shadow: 0 2px 4px rgba(229, 57, 53, 0.3);
            margin-top: 15px;
        }

        /* Стили для нижней фиксированной кнопки */
        .bottom-action-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background-color: #121212;
            border-top: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
            box-shadow: 0 -4px 6px rgba(0,0,0,0.1);
        }
        
        /* Иконки */
        .btn-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <svg class="btn-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 17L12 22L22 17" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p class="app-header-title">Управление Студией Dr.Cosmos</p>
    </div>

    <div class="card">
        <h2>
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2Z" stroke="#8833ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 6V18" stroke="#8833ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9.83 8C8.83 8.32 8.12 9.04 8 10C7.88 10.96 8.35 11.66 9.35 12.01L12.01 12.98C13.01 13.33 13.48 14.03 13.36 14.99C13.24 15.95 12.53 16.67 11.53 16.99" stroke="#8833ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Управление ценами
        </h2>
        <div class="form-group">
            <label for="service-select">Выберите услугу:</label>
            <select id="service-select">
                <option value="Infinity">🍹 Коктейль Инфинити</option>
                <option value="Renaissance">🍹 Коктейль Ренессанс</option>
                <option value="RenaissancePlus">🍹 Коктейль Ренессанс Плюс</option>
                <option value="InfHair">🍹 Коктейль Инфинити Hair</option>
                <option value="InfHairPlus">🍹 Коктейль Инфинити Hair Плюс</option>
                <option value="RFLifting">✨ РФ Лифтинг</option>
                <option value="Chistka">✨ Чистка лица</option>
                <option value="Botulo">✨ Ботулинотерапия</option>
                <option value="Lips">✨ Губы (контур)</option>
                <option value="LaserRemove">✨ Удаление лазером</option>
            </select>
        </div>
        <div class="form-group">
            <label for="new-price">Новая цена:</label>
            <input type="text" id="new-price" placeholder="Например: 130$ или 700.000 сум">
        </div>
        <button onclick="savePrice()">
            <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M13 3L3 13L13 23V3Z" fill="#ffffff"/>
                <path d="M11 1L21 11L11 21V1Z" fill="#ffffff"/>
            </svg>
            Применить новую цену
        </button>
    </div>

    <div class="card">
        <h2>
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2Z" stroke="#8833ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M7 11.5L10 14.5L17 7.5" stroke="#8833ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Массовая рассылка
        </h2>
        <div class="form-group">
            <label for="broadcast-text">Текст уведомления (HTML поддерживается):</label>
            <textarea id="broadcast-text" rows="4" placeholder="Введите текст акции или новости для клиентов..."></textarea>
        </div>
    </div>

    <div class="bottom-action-container">
        <button class="broadcast-btn" onclick="startBroadcast()">
            <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 21L21 12L1 3V10L11 12L1 14V21Z" fill="#ffffff"/>
            </svg>
            Запустить рассылку по базе
        </button>
    </div>

    <script>
        // Инициализируем Telegram WebApp API
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение на весь экран телефона

        function savePrice() {
            const service = document.getElementById('service-select').value;
            const price = document.getElementById('new-price').value;

            if (!price) {
                alert('Пожалуйста, введите цену!');
                return;
            }

            // Упаковываем данные в JSON формат
            const data = {
                action: "web_edit_price",
                service: service,
                price: price
            };

            // Отправляем данные обратно боту
            tg.sendData(JSON.stringify(data));
            tg.close(); // Закрываем WebApp после отправки
        }

        function startBroadcast() {
            const text = document.getElementById('broadcast-text').value;

            if (!text) {
                alert('Введите текст для рассылки!');
                return;
            }

            const data = {
                action: "web_broadcast",
                text: text
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
