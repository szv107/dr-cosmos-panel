<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr.Cosmos WebApp Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0b0713;
            background-image: 
                radial-gradient(circle at top left, rgba(136, 51, 255, 0.15), transparent 40%),
                radial-gradient(circle at bottom right, rgba(161, 75, 255, 0.1), transparent 50%);
            background-attachment: fixed;
            color: #ffffff;
            margin: 0;
            padding: 20px 15px 40px 15px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .app-header-title {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 22px;
            padding: 22px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h2 {
            margin-top: 0;
            color: #cdb0ff;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.5);
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.25);
            color: #ffffff;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        input:focus, textarea:focus {
            border-color: #9d52ff;
            outline: none;
            box-shadow: 0 0 15px rgba(157, 82, 255, 0.25);
        }

        .custom-select-wrapper {
            position: relative;
            width: 100%;
        }
        .custom-select-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.25);
            font-size: 14px;
            cursor: pointer;
        }
        .arrow-icon {
            transition: transform 0.2s ease;
            stroke: rgba(255,255,255,0.6);
        }
        .custom-select-wrapper.open .arrow-icon {
            transform: rotate(180deg);
        }

        .custom-options {
            position: relative; 
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 14px;
            border: 1px solid rgba(157, 82, 255, 0.2);
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .custom-select-wrapper.open .custom-options {
            display: block;
        }
        .custom-option {
            padding: 14px;
            cursor: pointer;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .custom-option:hover {
            background: rgba(157, 82, 255, 0.15);
            color: #ffffff;
        }
        .custom-option.selected {
            background: rgba(157, 82, 255, 0.25);
            color: #cdb0ff;
            font-weight: 500;
        }

        button {
            width: 100%;
            background: rgba(157, 82, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(157, 82, 255, 0.35);
            padding: 15px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            margin-top: 10px;
        }
        button:active { transform: scale(0.98); }

        .broadcast-btn {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#cdb0ff" stroke-width="1.5">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <p class="app-header-title">Управление Студией Dr.Cosmos</p>
    </div>

    <div class="card">
        <h2>Управление ценами</h2>
        <div class="form-group">
            <label>Выберите услугу:</label>
            <div class="custom-select-wrapper" id="serviceSelectWrapper">
                <div class="custom-select-trigger" onclick="toggleSelect(event)">
                    <span id="selectedLabel">🍹 Коктейль Инфинити</span>
                    <svg class="arrow-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
                <div class="custom-options">
                    <div class="custom-option selected" data-value="Infinity" onclick="selectOption(this)">🍹 Коктейль Инфинити</div>
                    <div class="custom-option" data-value="Renaissance" onclick="selectOption(this)">🍹 Коктейль Ренессанс</div>
                    <div class="custom-option" data-value="RenaissancePlus" onclick="selectOption(this)">🍹 Коктейль Ренессанс Плюс</div>
                    <div class="custom-option" data-value="InfHair" onclick="selectOption(this)">🍹 Коктейль Инфинити Hair</div>
                    <div class="custom-option" data-value="InfHairPlus" onclick="selectOption(this)">🍹 Коктейль Инфинити Hair Плюс</div>
                    <div class="custom-option" data-value="Mono" onclick="selectOption(this)">🪡 Моно нити</div>
                    <div class="custom-option" data-value="Screw" onclick="selectOption(this)">🪡 Скрю нити</div>
                    <div class="custom-option" data-value="PLLA" onclick="selectOption(this)">🪡 Кислота PLLA</div>
                    <div class="custom-option" data-value="Liquid" onclick="selectOption(this)">🪡 Жидкие нити</div>
                    <div class="custom-option" data-value="RFLifting" onclick="selectOption(this)">✨ РФ Лифтинг</div>
                </div>
            </div>
            <input type="hidden" id="service-value" value="Infinity">
        </div>

        <div class="form-group">
            <label for="new-price">Новая цена:</label>
            <input type="text" id="new-price" placeholder="Например: 150$ или 1.200.000 сум">
        </div>
        <button onclick="savePrice()">Применить цену</button>
    </div>

    <div class="card">
        <h2>Mass-рассылка</h2>
        <div class="form-group">
            <label for="broadcast-text">Текст уведомления:</label>
            <textarea id="broadcast-text" rows="4" placeholder="Введите текст акции для клиентов..."></textarea>
        </div>
        <button class="broadcast-btn" onclick="startBroadcast()">Запустить рассылку по базе</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function toggleSelect(e) {
            e.stopPropagation();
            document.getElementById('serviceSelectWrapper').classList.toggle('open');
        }

        function selectOption(element) {
            document.getElementById('selectedLabel').innerText = element.innerText;
            document.getElementById('service-value').value = element.getAttribute('data-value');
            document.querySelectorAll('.custom-option').forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('serviceSelectWrapper').classList.remove('open');
        }

        window.addEventListener('click', function() {
            document.getElementById('serviceSelectWrapper').classList.remove('open');
        });

        function savePrice() {
            const service = document.getElementById('service-value').value;
            const price = document.getElementById('new-price').value;
            if (!price) { alert('Пожалуйста, введите цену!'); return; }

            // Чистый JSON, который поймает питон
            tg.sendData(JSON.stringify({
                action: "web_edit_price",
                service: service,
                price: price
            }));
        }

        function startBroadcast() {
            const text = document.getElementById('broadcast-text').value;
            if (!text) { alert('Введите текст для рассылки!'); return; }

            // Чистый JSON, который поймает питон
            tg.sendData(JSON.stringify({
                action: "web_broadcast",
                text: text
            }));
        }
    </script>
</body>
</html>
